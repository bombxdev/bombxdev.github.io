<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Notes</title>
  <meta name="description" content="สมุดลิงก์ศึกษา AI: repo และบทความน่าสนใจ แยกหมวดเป็นโฟลเดอร์">
  <meta name="theme-color" content="#008080">
  <!-- Only this site's own scripts may run (no inline/third-party JS), so an
       injected script cannot reach the admin token. Thumbnails may come from any
       https host; api.microlink.io is only used by the admin to fill in title/image.
       bombxdev.goatcounter.com: anonymous usage stats (stats.js sends pixel hits, no
       GoatCounter script is loaded). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://bombxdev.goatcounter.com https://api.github.com https://raw.githubusercontent.com https://api.microlink.io; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="ai.css?v=7">
  <link rel="stylesheet" href="trends.css?v=4">
</head>
<body>
  <section id="trends" class="win tr-win" data-star-trends aria-label="GitHub Star Trends"></section>

  <main id="notes" class="wrap win">
    <div class="titlebar">
      <h1 class="title">🤖 AI Notes</h1>
      <span class="tb-btns" aria-hidden="true"><span>_</span><span>□</span><span>×</span></span>
    </div>

    <header class="top toolbar">
      <label class="search-l" for="search" data-i18n="ค้นหา:">ค้นหา:</label>
      <input id="search" type="search" placeholder="ลิงก์ / remark…" data-i18n-ph="ลิงก์ / remark…" autocomplete="off" spellcheck="false">
      <button type="button" id="viewToggle" class="chip view-toggle" hidden></button>
    </header>

    <div class="address"><span class="address-l">Address</span>
      <nav id="crumbs" class="crumbs" aria-label="ตำแหน่งโฟลเดอร์" data-i18n-aria="ตำแหน่งโฟลเดอร์"></nav>
    </div>

    <div class="content">
      <div id="adminBar" class="admin-bar" hidden></div>
      <div id="view"></div>
      <section id="adminBox" class="admin-box" hidden></section>
    </div>

    <footer class="statusbar"><span id="status" data-i18n="พร้อม">พร้อม</span><span id="visits" hidden></span></footer>
  </main>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="i18n.js?v=3"></script>
  <script src="stats.js?v=3"></script>
  <script src="trends.js?v=6"></script>
  <script src="ai.js?v=7"></script>
  <script src="taskbar.js?v=3"></script>
</body>
</html>
