<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GTA Online Map</title>
  <meta name="description" content="Searchable GTA Online map with collectibles and daily locations. No ads, no sign-up." data-i18n-attr="content:meta.description">
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" data-i18n-attr="aria-label:aria.sidebar">
      <header class="brand">
        <h1>GTA Online Map</h1>
        <label class="lang" title="Language">
          <span aria-hidden="true">🌐</span>
          <select id="lang" data-i18n-attr="aria-label:settings.language"></select>
        </label>
        <button id="closeSidebar" class="icon-btn" data-i18n-attr="aria-label:aria.closeMenu;title:aria.closeMenu">«</button>
      </header>

      <div class="search">
        <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:search.placeholder">
        <button id="clearSearch" class="icon-btn" data-i18n-attr="aria-label:aria.clearSearch" hidden>✕</button>
      </div>

      <div id="results" class="results" hidden></div>

      <section id="today" class="today" data-i18n-attr="aria-label:aria.today">
        <div class="today-head">
          <button id="dayPrev" class="icon-btn" data-i18n-attr="aria-label:aria.dayPrev">◀</button>
          <div class="today-title">
            <div id="dayLabel"></div>
            <div id="dayReset" class="muted"></div>
          </div>
          <button id="dayNext" class="icon-btn" data-i18n-attr="aria-label:aria.dayNext">▶</button>
        </div>
        <div id="todayList" class="today-list"></div>
        <label class="chip toggle"><input id="todayOnly" type="checkbox"> <span data-i18n="today.only"></span></label>
        <div id="todayStatus" class="today-status"></div>
      </section>

      <div class="toolbar">
        <button id="showAll" class="chip" data-i18n="toolbar.showAll"></button>
        <button id="hideAll" class="chip" data-i18n="toolbar.hideAll"></button>
        <label class="chip toggle"><input id="hideCollected" type="checkbox"> <span data-i18n="toolbar.hideCollected"></span></label>
      </div>

      <div id="categories" class="categories"></div>

      <section class="backup">
        <div class="toolbar">
          <button id="exportBtn" class="chip">⬇ <span data-i18n="settings.export"></span></button>
          <button id="importBtn" class="chip">⬆ <span data-i18n="settings.import"></span></button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="muted" data-i18n="settings.hint"></p>
      </section>

      <footer class="foot">
        <p data-i18n="foot.hint"></p>
        <p data-i18n-html="foot.daily"></p>
        <p data-i18n-html="foot.sources"></p>
        <p data-i18n="foot.legal"></p>
      </footer>
    </aside>
    <button id="backdrop" class="backdrop" tabindex="-1" data-i18n-attr="aria-label:aria.closeMenu"></button>

    <main id="mapWrap">
      <button id="openSidebar" class="fab" data-i18n-attr="aria-label:aria.openMenu;title:aria.openMenu" hidden><span class="only-desktop">☰</span><span class="only-mobile" data-i18n="mobile.open"></span></button>
      <div id="map"></div>
      <div id="cursor" class="cursor" aria-live="off"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="daily.js"></script>
  <script src="app.js"></script>
</body>
</html>
