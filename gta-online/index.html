<!DOCTYPE html>
<html lang="en" data-app-version="20261028-1">
<head>
  <meta charset="utf-8">

  <title>GTA Online Toolkit</title>
  <meta name="description" content="Fan-made GTA Online tools: searchable map with daily locations, heist planner with payout calculator and a beginner guide. No ads, no sign-up." data-i18n-attr="content:p.metaDesc">
  <meta name="theme-color" content="#0d0f1a">

    <span id="resetIn" class="mb-item mb-hide-s"></span>

      <select id="lang" data-i18n-attr="aria-label:p.language"></select></label>
    <span id="realClock" class="mb-item mb-clock"></span>

  <main id="desktop" class="desktop">

    <nav id="icons" class="icons" data-i18n-attr="aria-label:p.apps"></nav>
    <aside id="widgets" class="widgets" data-i18n-attr="aria-label:p.widgets"></aside>
    <div id="windows"></div>
  </main>

  <div id="launcher" class="launcher" hidden>
    <input id="launchSearch" type="search" autocomplete="off" data-i18n-attr="placeholder:p.search">
    <div id="launchList" class="launch-list"></div>
    <p class="launch-foot" data-i18n="p.legal"></p>
  </div>

  <nav id="dock" class="dock" data-i18n-attr="aria-label:p.dock"></nav>

  <script src="map/i18n.js?v=20261028-1"></script>
  <script src="map/daily.js?v=20261028-1"></script>

</html>
