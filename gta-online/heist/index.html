<!DOCTYPE html>
<html lang="en" data-app-version="20261029-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GTA Online Heist Planner</title>
  <meta name="description" content="Plan GTA Online heists: pick setups like the in-game board, work out payouts by difficulty and team size, see every deduction, set cuts and view entry and escape points on the map." data-i18n-attr="content:meta.description">
  <meta name="theme-color" content="#111318">
  <!-- Same policy as the map page: only this site's own scripts, and only GitHub
       is contacted (admin photo uploads), which limits what an injected script could do. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <!-- Shared look (colours, sidebar, menu) comes from the map page. -->
  <link rel="stylesheet" href="../map/style.css?v=20261029-2">
  <link rel="stylesheet" href="heist.css?v=20261029-2">
</head>
<body>
  <div id="app">
    <aside id="sidebar" data-i18n-attr="aria-label:aria.menu">
      <header class="brand">
        <h1>GTA Online Heist</h1>
        <label class="lang" title="Language">
          <span aria-hidden="true">🌐</span>
          <select id="lang" data-i18n-attr="aria-label:settings.language"></select>
        </label>
        <button id="closeSidebar" class="icon-btn" data-i18n-attr="aria-label:aria.closeMenu;title:aria.closeMenu">«</button>
      </header>

      <nav class="site-nav" data-i18n-attr="aria-label:nav.label">
        <a href="../" class="home" data-i18n-attr="title:nav.home;aria-label:nav.home">🏠</a>
        <a href="../map/">🗺 <span data-i18n="nav.map"></span></a>
        <a href="./" aria-current="page">💰 <span data-i18n="nav.heist"></span></a>
      </nav>

      <button type="button" id="guideBtn" class="guide-btn" data-h="guide" data-i18n="g.open"></button>

      <div class="group-title" data-i18n="side.pick"></div>
      <nav class="hlist" id="rail" data-i18n-attr="aria-label:side.pick"></nav>

      <p class="patch" data-i18n="side.patch"></p>

      <footer class="foot">
        <p data-i18n="foot.data"></p>
        <p data-i18n="foot.posters"></p>
        <p><a href="../map/credits.html" class="credits-link">❤ <span data-i18n="credits.link"></span></a></p>
        <p data-i18n="foot.legal"></p>
      </footer>
    </aside>
    <button id="backdrop" class="backdrop" tabindex="-1" data-i18n-attr="aria-label:aria.closeMenu"></button>

    <main id="page">
      <button id="openSidebar" class="fab" data-i18n-attr="aria-label:aria.openMenu;title:aria.openMenu" hidden><span class="only-desktop">☰</span><span class="only-mobile" data-i18n="mobile.open"></span></button>
      <div class="wrap">
        <nav class="tabs only-mobile-flex" id="tabs" data-i18n-attr="aria-label:side.pick"></nav>

        <section class="guide" id="guide"></section>

        <section class="shared-plan" id="sharedPlan" hidden></section>

        <section class="hero" id="hero"></section>

        <div class="hmain">
          <div id="board"></div>
          <div class="ticket" id="ticket">
            <div class="rc">
              <div class="rc-head"><h2 data-i18n="ticket.title"></h2><p id="rcsub"></p></div>
              <div id="summary"></div>
              <div id="cuts"></div>
              <div id="split"></div>
            </div>
            <div class="coach" id="coach"></div>
            <button type="button" class="btn share-btn" id="shareBtn" data-i18n="share.open"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bump data-app-version on <html> (and the ?v= on these files) on every deploy. -->
  <script src="../map/i18n.js?v=20261029-2"></script>
  <script src="photos.js?v=20261029-2"></script>
  <script src="heist.js?v=20261029-2"></script>
  <script src="share.js?v=20261029-2"></script>
</body>
</html>
